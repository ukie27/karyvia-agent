x-common-config: &common-config
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      # 逗号分隔的官方插件目录后缀，对应 plugins/karyvia-plugin-<名字>/。
      # 装进镜像还不等于启用——启用要写进 config.json 的 plugins.enabled。
      KARYVIA_PLUGINS: ${KARYVIA_PLUGINS:-openai-api}
  volumes:
    - ~/.karyvia:/home/karyvia/.karyvia
  cap_drop:
    - ALL

# 容器里跑的是新 Kernel（`karyvia`），只有两个服务：常驻的 `karyvia serve` 与交互式的 `karyvia run`。
# `karyvia serve` 服务的是**已启用的 Channel 插件**；官方插件用 Dockerfile 的
# `KARYVIA_PLUGINS` 构建参数装进镜像，再写进 `plugins.enabled` 才会生效。
services:
  karyvia-serve:
    container_name: karyvia-serve
    <<: *common-config
    command: ["serve", "--host", "0.0.0.0"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8760:8760
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  karyvia-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["run"]
    stdin_open: true
    tty: true
