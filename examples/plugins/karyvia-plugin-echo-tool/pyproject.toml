[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karyvia-plugin-echo-tool"
version = "0.1.0"
description = "Karyvia 示例插件：注册一个最小工具能力"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
# 插件只依赖 SDK 与契约（`R4`）。写成宿主的发行名而不是某个内部包——
# `karyvia.sdk` 不单独发行，能被 pip 解析的名字只有这一个。
dependencies = ["karyvia>=0.3.0"]

# 发现的唯一入口（技术方案 §7.1）。**name 必须等于 manifest 里的 `id`**：
# `plugins.enabled` 写的是这个 name，对不上即失败（`runtime/inventory.py::_validate`）。
# 值指向 manifest 对象而不是 `setup`——读一份声明不该导入实现。
[project.entry-points."karyvia.plugins"]
echo-tool = "karyvia_plugin_echo_tool:MANIFEST"

[tool.hatch.build.targets.wheel]
packages = ["src/karyvia_plugin_echo_tool"]
