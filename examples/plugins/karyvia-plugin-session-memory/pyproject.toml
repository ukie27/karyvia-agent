[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karyvia-plugin-session-memory"
version = "0.1.0"
description = "Karyvia 示例插件：用内存实现覆盖内建会话存储"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["karyvia>=0.3.0"]

# name 必须等于 manifest 的 `id`（技术方案 §7.1：候选 id 要先于 manifest 可知，
# 否则「未启用即不导入」没有实现路径）。
[project.entry-points."karyvia.plugins"]
session-memory = "karyvia_plugin_session_memory:MANIFEST"

[tool.hatch.build.targets.wheel]
packages = ["src/karyvia_plugin_session_memory"]
