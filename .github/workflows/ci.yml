name: Test Suite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 架构守卫是独立作业：它必须能在完整测试套件之外单独判定通过与否，
  # 失败即阻断合并。守卫只做 AST/文本静态检查，不装 channel 可选依赖。
  architecture:
    name: Architecture guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Layer boundaries R1-R5 / docstrings / file size / Any
        run: pytest tests/architecture -q

      - name: Startup cost
        run: python scripts/check_startup_cost.py --check

  python:
    name: Lint / Type / Test
    runs-on: ubuntu-latest
    env:
      NUCLEAMIND_HOME: ${{ runner.temp }}/.nucleamind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      # 插件经 entry point 被发现，因此必须真的装进环境（D30 的两个示例、D31 的官方
      # openai-api、D32 的 anthropic、D34 的 feishu、D36-D38 的
      # web / mcp、D39 的 memory、D40 的 cron）。tests/e2e/ 的第一条用例会在
      # 没装时明确报出来。
      # **这张清单漏一个就是 CI 红**：`testpaths` 收集整个 `plugins/`，而每棵测试树都
      # `import nucleamind_plugin_<id>`——没装就是收集期 ModuleNotFoundError，
      # 不是「少跑几个用例」。加官方插件时必须同时加这里（D40 发现 D36 起漏了五个）。
      # **--no-deps 是刻意的**：平台 SDK（lark-oapi / mcp）因此不在 CI
      # 环境里，而那三个插件的测试树仍须全绿——这正是「只有一两个模块接触 SDK」换来的
      # 东西。cron 的 tzdata 同理：它整棵测试树都不依赖时区数据库。
      - name: Install plugins
        run: |
          pip install --no-deps -e examples/plugins/nucleamind-plugin-echo-tool
          pip install --no-deps -e examples/plugins/nucleamind-plugin-session-memory
          pip install --no-deps -e plugins/nucleamind-plugin-openai-api
          pip install --no-deps -e plugins/nucleamind-plugin-anthropic
          pip install --no-deps -e plugins/nucleamind-plugin-feishu
          pip install --no-deps -e plugins/nucleamind-plugin-web
          pip install --no-deps -e plugins/nucleamind-plugin-mcp
          pip install --no-deps -e plugins/nucleamind-plugin-memory
          pip install --no-deps -e plugins/nucleamind-plugin-cron
          nm plugins install --no-deps examples/plugins/nucleamind-plugin-echo-tool
          nm plugins install --no-deps examples/plugins/nucleamind-plugin-session-memory
          nm plugins install --no-deps plugins/nucleamind-plugin-openai-api
          nm plugins install --no-deps plugins/nucleamind-plugin-anthropic
          nm plugins install --no-deps plugins/nucleamind-plugin-feishu
          nm plugins install --no-deps plugins/nucleamind-plugin-web
          nm plugins install --no-deps plugins/nucleamind-plugin-mcp
          nm plugins install --no-deps plugins/nucleamind-plugin-memory
          nm plugins install --no-deps plugins/nucleamind-plugin-cron

      - name: Lint
        run: ruff check src/ plugins/ examples/ scripts/ tests/

      - name: Type check
        run: basedpyright

      - name: Test
        run: pytest
