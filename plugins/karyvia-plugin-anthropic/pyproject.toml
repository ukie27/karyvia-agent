[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karyvia-plugin-anthropic"
version = "0.1.0"
description = "Karyvia 官方插件：Anthropic 原生 Messages API 的 Model Provider"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
# 插件只依赖 SDK 与契约（`R4`）。**不依赖 `anthropic` 官方 SDK**：本实现直接用 httpx
# （宿主发行版已带），因此可以注入 `httpx.MockTransport` 让整套用例零真实网络地跑，
# 与内建 `model_openai` 同构。
dependencies = ["karyvia>=0.3.0"]

# 发现的唯一入口（技术方案 §7.1）。name 必须等于 manifest 里的 `id`。
[project.entry-points."karyvia.plugins"]
anthropic = "karyvia_plugin_anthropic:MANIFEST"

[tool.hatch.build.targets.wheel]
packages = ["src/karyvia_plugin_anthropic"]
