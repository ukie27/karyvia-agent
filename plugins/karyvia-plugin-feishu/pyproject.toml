[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karyvia-plugin-feishu"
version = "0.1.0"
description = "Karyvia 官方插件：飞书 / Lark Channel"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
# 插件只依赖 SDK 与契约（`R4`）。`lark-oapi` 是**运行期可选**依赖：它只在
# `gateway.connect()` 与 `client.py` 的首次调用里被惰性 import，装了这个插件却没装它时
# 给一句能照做的错误，而不是在导入 manifest 时就炸掉整个实例（`D31`/`D33` 的同一条做法）。
#
# 注意：`lark-oapi` 自己的元数据是 `websockets<16,>=11`——那条约束因此跟着**这个包**走，
# 不再落在宿主的核心依赖上。
dependencies = ["karyvia>=0.3.0"]

[project.optional-dependencies]
gateway = ["lark-oapi>=1.5.0,<2.0.0"]

# 发现的唯一入口（技术方案 §7.1）。name 必须等于 manifest 里的 `id`。
[project.entry-points."karyvia.plugins"]
feishu = "karyvia_plugin_feishu:MANIFEST"

[tool.hatch.build.targets.wheel]
packages = ["src/karyvia_plugin_feishu"]
