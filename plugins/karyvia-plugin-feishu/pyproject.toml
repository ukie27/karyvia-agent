[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karyvia-plugin-feishu"
version = "0.1.0"
description = "Karyvia 官方插件：飞书 / Lark Channel"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
# `lark-oapi` 是飞书 Channel 的运行依赖。代码仍然惰性 import 它，避免导入 manifest
# 时初始化 SDK；但正常安装插件时必须由安装器一并解析该依赖。
dependencies = [
  "karyvia>=0.3.0",
  "lark-oapi>=1.5.0,<2.0.0",
]

# 发现的唯一入口。name 必须等于 manifest 里的 `id`。
[project.entry-points."karyvia.plugins"]
feishu = "karyvia_plugin_feishu:MANIFEST"

[tool.hatch.build.targets.wheel]
packages = ["src/karyvia_plugin_feishu"]
