[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karyvia-plugin-memory"
version = "0.1.0"
description = "Karyvia 官方插件：跨 Session 的长期记忆（JSONL 存储 + 关键词召回）"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
# 插件只依赖 SDK 与契约（`R4`）。**一个新依赖都不引入**：存储是 JSONL、检索是自写打分，
# 两者都只用标准库，理由见 README 的「刻意不做的事」。
dependencies = ["karyvia>=0.3.0"]

# 发现的唯一入口。name 必须等于 manifest 里的 `id`。
[project.entry-points."karyvia.plugins"]
memory = "karyvia_plugin_memory:MANIFEST"

[tool.hatch.build.targets.wheel]
packages = ["src/karyvia_plugin_memory"]
