[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karyvia-plugin-mcp"
version = "0.1.0"
description = "Karyvia 官方插件：把 MCP server 的工具接进实例"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
# 插件只依赖 SDK 与契约（`R4`）。`mcp` 是**运行期可选**依赖：只有 `client.py` 会
# 惰性 import 它，装了这个插件却没装它时给一句能照做的错误，而不是在导入期就炸掉整个
# 实例（`openai-api` 对 `aiohttp` 也采用同一条做法）。
dependencies = ["karyvia>=0.3.0"]

[project.optional-dependencies]
client = ["mcp>=1.9.0,<2.0.0"]

# 发现的唯一入口。name 必须等于 manifest 里的 `id`。
[project.entry-points."karyvia.plugins"]
mcp = "karyvia_plugin_mcp:MANIFEST"

[tool.hatch.build.targets.wheel]
packages = ["src/karyvia_plugin_mcp"]
